name: Keep prod awake

# Render free sleeps after 15 idle minutes, and the reminder/digest @Scheduled
# jobs only run while it is awake — a 16:30 reminder on a sleeping instance is
# never sent (the scheduler's catch-up is 5 minutes, and nothing wakes it).
# /actuator/health is unauthenticated and checks the DB, so this also keeps TiDB warm.
#
# ponytail: GitHub's cron is best-effort — runs can land late or be skipped under
# load, and it is disabled after 60 days without a commit. An external pinger
# (cron-job.org / UptimeRobot, free, no card) at 5 minutes is the reliable
# version; keep this as the fallback. 24/7 uptime costs ~744 of Render's 750
# free instance-hours, so this only fits while it is the sole free service.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # --retry covers the cold start when a ping lands on an instance that did fall asleep.
      - run: curl -fsS --retry 5 --retry-delay 20 --max-time 120 https://growth-buddy-cu63.onrender.com/actuator/health
