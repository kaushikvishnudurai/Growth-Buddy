server:
  port: 8080
  # Headroom for the request header. The web app keeps a little state in cookies,
  # which ride on every request; the default 8KB can be exceeded, and Tomcat then
  # rejects the request ("Request header is too large"). The frontend also keeps
  # cookies to a small allowlist — this is the belt to that suspenders.
  max-http-request-header-size: 65536
  tomcat:
    threads:
      # Worker threads. Sized for the 512MB instance this actually deploys to,
      # where every started thread is a stack the JVM cannot give to metaspace;
      # the DB pool is 8 anyway, so 300 workers only queue harder on Hikari.
      # Raise both on real hardware. Tune under load test.
      max: ${TOMCAT_MAX_THREADS:50}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:5}
    # Keep-alive sockets from ~10k concurrent clients.
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: 200
    connection-timeout: 10s

spring:
  application:
    name: growth-buddy-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:growth_buddy}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Sized for a free/small MySQL tier, where the binding limit is the
      # server's max_connections (often 20-60 shared) and the RAM each idle
      # connection holds — not throughput. Raise DB_POOL_SIZE on real hardware;
      # MySQL max_connections must comfortably exceed it.
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: 2
      # Fail fast instead of a 30s pile-up. This is the driver's LOGIN budget,
      # not just the TCP connect, so it only suits a MySQL on localhost —
      # application-prod.yml raises it for a remote TLS database.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      max-lifetime: 600000       # must be < MySQL wait_timeout
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      # Dev uses 'update' so Hibernate can create tables on the fly. In prod set
      # SPRING_JPA_DDL_AUTO=validate (schema is owned by tableCreationQueries.sql)
      # so a deploy can't silently ALTER/lock a large live table.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        type:
          # Store java.util.UUID as CHAR(36) text, matching the existing schema
          # (users.id etc. are varchar(36)); the default BINARY(16) mapping made
          # every UUID lookup miss and broke ddl-auto updates.
          preferred_uuid_jdbc_type: CHAR
    open-in-view: false

  task:
    scheduling:
      # More than one thread so a slow reminder/digest run can't stall the others.
      pool:
        size: 4

  jackson:
    default-property-inclusion: non_null

  # Gmail SMTP — set MAIL_USER + MAIL_PASS env vars (Gmail "app password").
  # If unset, MailService logs OTPs to the console instead of sending.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# The mail health indicator opens an SMTP socket on every /actuator/health call.
# That is the wrong liveness signal twice over: transactional email being down
# does not make the app unable to serve, and on a host that blocks SMTP ports it
# can never pass — so the endpoint reports DOWN forever and any uptime monitor
# pointed at it alerts continuously. The datasource check, which does matter,
# stays on.
management:
  health:
    mail:
      enabled: false

# Cross-origin so the static file:// / localhost frontend can call the API.
growthbuddy:
  cors:
    # Comma-separated origins; default is local development only.
    # Override via CORS_ALLOWED_ORIGINS in deployment.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}
  session:
    # HMAC-SHA256 key used when storing session token hashes in the DB.
    # A DB dump alone cannot validate tokens without this secret.
    # MUST be overridden in production via SESSION_HMAC_SECRET env var.
    hmac-secret: ${SESSION_HMAC_SECRET:growth-buddy-dev-hmac-secret-replace-in-production}
  # Seeded demo account for local development only; DataSeeder skips it under
  # the prod profile. Identity comes from the bearer token, never a header.
  demo-user-id: "00000000-0000-0000-0000-000000000001"
  mail:
    # Public-facing name in the From header.
    from-name: ${MAIL_FROM_NAME:Growth Buddy}
    # From address. If empty, falls back to spring.mail.username (gmail account).
    from-address: ${MAIL_FROM:}
    # Mailjet REST API. Set these and mail goes over HTTPS instead of SMTP.
    # Required on hosts that block outbound SMTP ports (Render's free tier
    # blocks 25/465/587), where JavaMailSender can only ever time out.
    #
    # Mailjet rather than Brevo because api.brevo.com sits behind Cloudflare,
    # which terminates the TLS handshake from Render's shared egress IPs before
    # any request is sent. api.mailjet.com is not fronted that way.
    api-key: ${MAILJET_API_KEY:}
    api-secret: ${MAILJET_SECRET_KEY:}
    api-url: ${MAILJET_API_URL:https://api.mailjet.com/v3.1/send}
  mentor:
    # OpenAI integration. If api-key is empty the mentor falls back to a
    # canned encouraging reply so the feature still loads end-to-end.
    api-key: ${OPENAI_API_KEY:${MENTOR_API_KEY:}}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  # Web Push (VAPID). Generate a key pair once and set the env vars to enable
  # browser push notifications. Left empty, push is simply disabled.
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:hello@growthbuddy.app}
  whatsapp:
    # Set enabled=true + Meta WhatsApp Cloud API credentials to send reminder messages.
    enabled: ${WHATSAPP_ENABLED:false}
    meta:
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      api-version: ${WHATSAPP_API_VERSION:v21.0}
      # Name of an approved template whose body is a single {{1}} variable. Required for
      # scheduled reminders; left empty, sends fall back to free-form text, which Meta
      # only delivers inside a user's 24h customer-service window.
      template: ${WHATSAPP_TEMPLATE:}
      # AUTHENTICATION-category template for login codes. Needs a verified business to
      # create; empty => OTPs fall back to the reminder template above.
      auth-template: ${WHATSAPP_AUTH_TEMPLATE:}
      template-lang: ${WHATSAPP_TEMPLATE_LANG:en}

logging:
  level:
    org.hibernate.SQL: warn
