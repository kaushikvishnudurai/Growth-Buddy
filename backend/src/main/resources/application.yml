server:
  port: 8080
  # Headroom for the request header. The web app keeps a little state in cookies,
  # which ride on every request; the default 8KB can be exceeded, and Tomcat then
  # rejects the request ("Request header is too large"). The frontend also keeps
  # cookies to a small allowlist — this is the belt to that suspenders.
  max-http-request-header-size: 65536
  tomcat:
    threads:
      # Worker threads. Fine once no request holds a DB connection for a slow
      # external call (see MentorService / schedulers). Tune under load test.
      max: ${TOMCAT_MAX_THREADS:300}
      min-spare: 25
    # Keep-alive sockets from ~10k concurrent clients.
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: 200
    connection-timeout: 10s

spring:
  application:
    name: growth-buddy-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:growth_buddy}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # MySQL throughput peaks at a few dozen active connections — a huge pool
      # just makes the DB slower. Ensure MySQL max_connections comfortably exceeds this.
      maximum-pool-size: ${DB_POOL_SIZE:40}
      minimum-idle: 10
      connection-timeout: 3000   # fail fast instead of a 30s pile-up
      max-lifetime: 600000       # must be < MySQL wait_timeout
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      # Dev uses 'update' so Hibernate can create tables on the fly. In prod set
      # SPRING_JPA_DDL_AUTO=validate (schema is owned by tableCreationQueries.sql)
      # so a deploy can't silently ALTER/lock a large live table.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        type:
          # Store java.util.UUID as CHAR(36) text, matching the existing schema
          # (users.id etc. are varchar(36)); the default BINARY(16) mapping made
          # every UUID lookup miss and broke ddl-auto updates.
          preferred_uuid_jdbc_type: CHAR
    open-in-view: false

  task:
    scheduling:
      # More than one thread so a slow reminder/digest run can't stall the others.
      pool:
        size: 4

  jackson:
    default-property-inclusion: non_null

  # Gmail SMTP — set MAIL_USER + MAIL_PASS env vars (Gmail "app password").
  # If unset, MailService logs OTPs to the console instead of sending.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Cross-origin so the static file:// / localhost frontend can call the API.
growthbuddy:
  cors:
    # Comma-separated origins; default is local development only.
    # Override via CORS_ALLOWED_ORIGINS in deployment.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}
  session:
    # HMAC-SHA256 key used when storing session token hashes in the DB.
    # A DB dump alone cannot validate tokens without this secret.
    # MUST be overridden in production via SESSION_HMAC_SECRET env var.
    hmac-secret: ${SESSION_HMAC_SECRET:growth-buddy-dev-hmac-secret-replace-in-production}
  # Demo user used when no X-User-Id header is supplied (no auth layer yet).
  demo-user-id: "00000000-0000-0000-0000-000000000001"
  mail:
    # Public-facing name in the From header.
    from-name: ${MAIL_FROM_NAME:Growth Buddy}
    # From address. If empty, falls back to spring.mail.username (gmail account).
    from-address: ${MAIL_FROM:}
  mentor:
    # OpenAI integration. If api-key is empty the mentor falls back to a
    # canned encouraging reply so the feature still loads end-to-end.
    api-key: ${OPENAI_API_KEY:${MENTOR_API_KEY:}}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  # Web Push (VAPID). Generate a key pair once and set the env vars to enable
  # browser push notifications. Left empty, push is simply disabled.
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:hello@growthbuddy.app}
  google:
    # Google Calendar (read-only) OAuth. Create a "Web application" OAuth client
    # at https://console.cloud.google.com/apis/credentials, enable the Google
    # Calendar API, and register redirect-uri below. Left empty, the Settings
    # section reports "not configured" and everything else still works.
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google/calendar/callback}
  whatsapp:
    # Set enabled=true + Meta WhatsApp Cloud API credentials to send reminder messages.
    enabled: ${WHATSAPP_ENABLED:false}
    meta:
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      api-version: ${WHATSAPP_API_VERSION:v21.0}

logging:
  level:
    org.hibernate.SQL: warn
