<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <meta
      name="description"
      content="Growth Buddy — your friendly accountability app for habits, tasks, fitness and growth."
    />
    <title>Growth Buddy</title>

    <!-- sockjs-client (CommonJS) references the Node `global`, which doesn't
         exist in the browser. The old CDN UMD build shimmed it; the bundled
         npm version doesn't, so define it before the module entry loads. -->
    <script>
      window.global = window.global || window;
    </script>

    <link rel="icon" type="image/svg+xml" href="assets/logomark.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Growth Buddy" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/mini-calendar.css" />
    <link rel="stylesheet" href="styles/money.css" />
  </head>
  <body>
    <div class="gb-page">
      <div id="root"></div>
    </div>

    <!-- Single ES module entry; Vite bundles the import graph and the npm deps
       (lucide, sockjs-client, @stomp/stompjs) that used to load from CDNs. -->
    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
